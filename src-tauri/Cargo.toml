[package]
name = "ia-k"
version = "0.1.0"
description = "IA-K, a local and portable document assistant"
authors = ["fhoudebert"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "iak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
