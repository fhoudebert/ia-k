<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA-K</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <!-- shown until the Python backend is ready -->
  <div id="boot" class="boot">
    <img src="logo.png" alt="" class="boot-logo">
    <p id="boot-message" data-i18n="app.starting"></p>
    <p id="boot-detail" class="muted"></p>
    <button id="boot-retry" hidden data-i18n="app.retry"></button>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="logo.png" alt=""> IA-K</div>
      <nav class="tabs" role="tablist">
        <button data-view="library" data-i18n="nav.library"></button>
        <button data-view="search" data-i18n="nav.search"></button>
        <button data-view="ask" data-i18n="nav.ask"></button>
        <button data-view="viewer" data-i18n="nav.viewer" hidden id="tab-viewer"></button>
      </nav>
      <div class="servers" id="servers"></div>
      <button class="link" id="lang-switch" data-i18n="lang.switch"></button>
    </header>

    <div id="remote-warning" class="banner warn" hidden data-i18n="server.remote"></div>
    <div id="toast" class="toast" hidden></div>

    <!-- library -->
    <main id="view-library" class="view">
      <div class="toolbar">
        <button class="primary" id="import-btn" data-i18n="lib.import"></button>
        <label class="check"><input type="checkbox" id="import-reference">
          <span data-i18n="lib.reference"></span></label>
        <span class="muted" data-i18n="lib.drop"></span>
        <span class="spacer"></span>
        <input id="compare-question" data-i18n-placeholder="compare.question" hidden>
        <button id="compare-btn" data-i18n="lib.compare" hidden></button>
      </div>
      <div id="drop-zone" class="drop-zone">
        <p id="library-empty" class="empty" data-i18n="lib.empty" hidden></p>
        <table id="library-table" class="table" hidden>
          <thead><tr>
            <th></th>
            <th data-i18n="lib.col.name"></th>
            <th data-i18n="lib.col.kind"></th>
            <th data-i18n="lib.col.added"></th>
            <th data-i18n="lib.col.state"></th>
            <th class="num" data-i18n="lib.col.units"></th>
            <th class="num" data-i18n="lib.col.ocr"></th>
            <th class="num" data-i18n="lib.col.passages"></th>
            <th></th>
          </tr></thead>
          <tbody id="library-rows"></tbody>
        </table>
      </div>
      <section class="panel" id="result-panel" hidden>
        <div class="panel-head"><h3 id="result-title"></h3>
          <button class="link close" id="result-close">×</button></div>
        <div id="result-body" class="prose"></div>
      </section>
      <section class="jobs">
        <h3 data-i18n="jobs.title"></h3>
        <ul id="jobs-list"></ul>
      </section>
    </main>

    <!-- search -->
    <main id="view-search" class="view" hidden>
      <form id="search-form" class="query">
        <input id="search-input" data-i18n-placeholder="search.placeholder" autocomplete="off">
        <select id="search-mode">
          <option value="auto" data-i18n="search.mode.auto"></option>
          <option value="hybrid" data-i18n="search.mode.hybrid"></option>
          <option value="kw" data-i18n="search.mode.kw"></option>
          <option value="sem" data-i18n="search.mode.sem"></option>
        </select>
        <button class="primary" data-i18n="search.go"></button>
      </form>
      <p id="search-count" class="muted"></p>
      <ol id="search-results" class="results"></ol>
    </main>

    <!-- questions -->
    <main id="view-ask" class="view" hidden>
      <div id="chat" class="chat">
        <p class="muted" id="chat-empty" data-i18n="ask.empty"></p>
      </div>
      <form id="ask-form" class="query">
        <input id="ask-input" data-i18n-placeholder="ask.placeholder" autocomplete="off">
        <button class="primary" data-i18n="ask.go"></button>
      </form>
    </main>

    <!-- document viewer -->
    <main id="view-viewer" class="view viewer" hidden>
      <div class="viewer-head">
        <button class="link" id="viewer-back">← <span data-i18n="viewer.back"></span></button>
        <h2 id="viewer-title"></h2>
        <span class="spacer"></span>
        <button id="viewer-summary" data-i18n="viewer.summary"></button>
        <button id="viewer-reextract" data-i18n="viewer.reextract"></button>
      </div>
      <div class="viewer-body">
        <aside class="units">
          <h4 data-i18n="viewer.units"></h4>
          <ul id="unit-list"></ul>
        </aside>
        <section class="page">
          <img id="page-image" alt="">
          <p id="page-no-image" class="muted" data-i18n="viewer.no_image" hidden></p>
        </section>
        <section class="side">
          <div class="side-head">
            <h4 data-i18n="viewer.text"></h4>
            <span id="unit-badges"></span>
          </div>
          <textarea id="unit-text" spellcheck="false"></textarea>
          <button id="unit-save" data-i18n="viewer.save"></button>
          <div class="analyse" id="analyse-box">
            <h4 data-i18n="viewer.analyse"></h4>
            <select id="look-task">
              <option value="describe" data-i18n="viewer.task.describe"></option>
              <option value="transcribe" data-i18n="viewer.task.transcribe"></option>
              <option value="error" data-i18n="viewer.task.error"></option>
              <option value="extract" data-i18n="viewer.task.extract"></option>
              <option value="ask" data-i18n="viewer.task.ask"></option>
            </select>
            <input id="look-question" data-i18n-placeholder="viewer.question" hidden>
            <button id="look-run" class="primary" data-i18n="viewer.run"></button>
          </div>
          <h4 data-i18n="viewer.analyses"></h4>
          <div id="analyses" class="analyses"></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
